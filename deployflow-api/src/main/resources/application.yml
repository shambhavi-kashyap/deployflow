spring:
  application:
    name: deployflow-api

  datasource:
    url: jdbc:postgresql://localhost:5432/deployflow
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

# ==========================================
# NEW: Prometheus Metrics & Health Actuator
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
    github:
      webhook-secret: "my_super_secret_deployflow_password_123"